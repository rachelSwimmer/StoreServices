services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: storeservices-db
    environment:
      MSSQL_SA_PASSWORD: "Strong@Passw0rd!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1434:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Strong@Passw0rd!" -C -Q "SELECT 1" -b || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - store-internal

  redis:
    image: redis:alpine
    container_name: storeservices-redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - store-internal

  # Message broker for the async pub/sub example (OrderCreated -> notifications).
  # The "-management" image also serves a web UI on 15672 (login: guest/guest)
  # where students can watch exchanges, queues and message rates live.
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: storeservices-rabbitmq
    ports:
      - "5672:5672"    # AMQP protocol (services connect here)
      - "15672:15672"  # management UI (open http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: "guest"
      RABBITMQ_DEFAULT_PASS: "guest"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - store-internal

  user-auth-service:
    build:
      context: .
      dockerfile: src/UserAuthService/Dockerfile
    container_name: user-auth-service
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=UserAuthDb;User Id=sa;Password=Strong@Passw0rd!;TrustServerCertificate=True;"
      ConnectionStrings__Redis: "redis:6379"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - store-internal

  # --- Load-balancer example: 3 identical ProductCatalog replicas behind Nginx ---
  # Shared definition (anchor); each replica only overrides its name and debug port.
  product-catalog-1: &product-catalog
    build:
      context: .
      dockerfile: src/ProductCatalogService/Dockerfile
    container_name: product-catalog-1
    ports:
      - "8091:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=CatalogDb;User Id=sa;Password=Strong@Passw0rd!;TrustServerCertificate=True;"
      ConnectionStrings__Redis: "redis:6379"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - store-internal

  product-catalog-2:
    <<: *product-catalog
    container_name: product-catalog-2
    ports:
      - "8092:8080"

  product-catalog-3:
    <<: *product-catalog
    container_name: product-catalog-3
    ports:
      - "8093:8080"

  # L7 load balancer in front of the three replicas. The gateway and the
  # service-to-service callers all target this instead of a single instance.
  nginx-catalog-lb:
    image: nginx:alpine
    container_name: nginx-catalog-lb
    ports:
      - "8085:8080"
    volumes:
      - ./nginx/catalog-lb.conf:/etc/nginx/nginx.conf:ro
    depends_on:

      - product-catalog-1
      - product-catalog-2
      - product-catalog-3
    networks:
      - store-internal
      

  order-service:
    build:
      context: .
      dockerfile: src/OrderService/Dockerfile
    container_name: order-service
    ports:
      - "8083:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=OrderDb;User Id=sa;Password=Strong@Passw0rd!;TrustServerCertificate=True;"
      Services__UserAuthService: "http://user-auth-service:8080/"
      Services__CatalogService: "http://nginx-catalog-lb:8080/"
      RabbitMq__HostName: "rabbitmq"
    depends_on:
      sqlserver:
        condition: service_healthy
      user-auth-service:
        condition: service_started
      nginx-catalog-lb:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - store-internal

  # Consumer microservice: listens for OrderCreated events and "sends" a
  # confirmation notification (logs it). Has no HTTP API and no database —
  # it only needs the broker.
  notification-service:
    build:
      context: .
      dockerfile: src/NotificationService/Dockerfile
    container_name: notification-service
    ports:
      - "8086:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      RabbitMq__HostName: "rabbitmq"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - store-internal

  bff-service:
    build:
      context: .
      dockerfile: src/BffService/Dockerfile
    container_name: bff-service
    ports:
      - "8084:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      Services__OrderService: "http://order-service:8080/"
      Services__UserAuthService: "http://user-auth-service:8080/"
      Services__CatalogService: "http://nginx-catalog-lb:8080/"
    depends_on:
      - order-service
      - user-auth-service
      - nginx-catalog-lb
    networks:
      - store-internal

  api-gateway:
    build:
      context: .
      dockerfile: src/ApiGateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8082:8080"
    depends_on:
      - user-auth-service
      - nginx-catalog-lb
      - order-service
      - bff-service
    networks:
      - store-internal

networks:
  store-internal:
    driver: bridge

volumes:
  sqlserver-data:
  redis-data:
