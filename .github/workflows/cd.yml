name: CD

# Build a Docker image for each service and push it to the GitHub Container
# Registry (ghcr.io). Runs only after code lands on main.
on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual runs from the Actions tab

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write # needed to push to ghcr.io

    # One image per service. Every Dockerfile uses the repo root as its build
    # context (it COPYs src/SharedKernel + src/<service>), so context is always ".".
    strategy:
      fail-fast: false
      matrix:
        service:
          - ApiGateway
          - UserAuthService
          - ProductCatalogService
          - OrderService
          - BffService
          - NotificationService

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lower-case the image name; ghcr requires it and repo owners may be mixed-case.
      - name: Compute image name
        id: img
        run: echo "name=${REGISTRY,,}/${GITHUB_REPOSITORY,,}/${SERVICE,,}" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          SERVICE: ${{ matrix.service }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/${{ matrix.service }}/Dockerfile
          push: true
          # Tag with both the commit SHA (immutable) and latest (moving).
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.sha }}
            ${{ steps.img.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
