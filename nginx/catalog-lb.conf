# Load-balancer example for StoreServices.
# Sits in front of the three ProductCatalog replicas. The API gateway and the
# service-to-service callers (OrderService, BffService) all proxy through here.

worker_processes 1;
events { worker_connections 1024; }

http {
    upstream catalog {
        # --- Algorithm comparison ---
        # Default (no directive) = round-robin. Uncomment the next line for
        # least-connections; scripts/lb-demo.sh toggles this automatically.
        # least_conn;

        # max_fails / fail_timeout = passive health-check eviction: after 2
        # failed responses an instance is taken out of rotation for 10s, even
        # though its container is still running.
        server product-catalog-1:8080 max_fails=2 fail_timeout=10s;
        server product-catalog-2:8080 max_fails=2 fail_timeout=10s;
        server product-catalog-3:8080 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://catalog;

            # Clean failover: if an instance errors/times out or returns 503,
            # transparently retry the request on the next instance so the
            # client never sees the failure.
            proxy_next_upstream error timeout http_503;
            proxy_next_upstream_tries 3;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Surface which replica actually served the request.
            add_header X-LB-Upstream $upstream_addr always;
        }
    }
}
